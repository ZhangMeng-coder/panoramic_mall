<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>全景商城 · 前台（风格样张）</title>
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/mall.css" />
  </head>
  <body>
    <!-- ====================================================================
         样张说明条：纯演示外壳，不属于页面设计的一部分，交付时删掉即可。
         ==================================================================== -->
    <div class="demo-bar">
      <div class="container demo-bar__inner">
        <span class="demo-bar__dot"></span>
        <strong>风格样张</strong>
        <span class="demo-bar__sep">·</span>
        <span>用于确认整体风格 / 展示结构 / 内容范围，非最终实现</span>
        <span class="demo-bar__sep">·</span>
        <span>不接接口、不做手机适配、只做宽屏</span>
      </div>
    </div>

    <!-- ====================================================================
         ① 顶部用户条：左「登录信息」，右「购物车 / 我的订单」
         未登录态与已登录态两套结构由 scripts/main.js 按 DEMO_LOGGED_IN 渲染
         ==================================================================== -->
    <header class="topbar">
      <div class="container topbar__inner">
        <div class="topbar__account" id="topbarAccount"></div>

        <nav class="topbar__nav">
          <a class="topbar__link" href="#">
            <svg class="topbar__icon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M3 4h2l2.4 11.2A2 2 0 0 0 9.36 17h8.5a2 2 0 0 0 1.96-1.6L21.5 7H6"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <circle cx="10" cy="20" r="1.3" fill="currentColor" />
              <circle cx="18" cy="20" r="1.3" fill="currentColor" />
            </svg>
            购物车
            <span class="topbar__count tnum">3</span>
          </a>
          <span class="topbar__divider"></span>
          <a class="topbar__link" href="#">
            <svg class="topbar__icon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M6 3h12a1 1 0 0 1 1 1v16l-3.5-2.2L12 20l-3.5-2.2L5 20V4a1 1 0 0 1 1-1z"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linejoin="round"
              />
              <path
                d="M9 8h6M9 12h6"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
              />
            </svg>
            我的订单
          </a>

          <!-- 演示用：切换登录态。真实页面不会有这一项 -->
          <button class="demo-toggle" id="demoToggle" type="button">
            切换登录态
          </button>
        </nav>
      </div>
    </header>

    <!-- ====================================================================
         ② 万能搜索长框（含下方热搜词行）
         ==================================================================== -->
    <section class="search">
      <div class="container">
        <form class="search__box" id="searchForm" autocomplete="off">
          <svg class="search__icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle
              cx="11"
              cy="11"
              r="6.5"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            />
            <path
              d="M16 16l4.5 4.5"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
          </svg>
          <label class="sr-only" for="searchInput">搜索商品</label>
          <input
            class="search__input"
            id="searchInput"
            type="search"
            placeholder="搜索商品、品牌、分类…"
          />
          <button class="search__btn" type="submit">搜索</button>
        </form>

        <p class="search__hint" id="searchHint" role="status"></p>

        <div class="search__hot">
          <span class="search__hot-label">热搜</span>
          <ul class="search__hot-list" id="hotwords"></ul>
        </div>
      </div>
    </section>

    <!-- ====================================================================
         ③ 全分类展示
         ==================================================================== -->
    <section class="cats">
      <div class="container">
        <ul class="cats__grid" id="catsGrid"></ul>
      </div>
    </section>

    <!-- ====================================================================
         ④ 大型滚动广告框（自动播放 + 箭头 + 圆点 + 悬停暂停）
         ==================================================================== -->
    <section class="banner">
      <div class="container">
        <div class="carousel" id="carousel">
          <div class="carousel__viewport">
            <div class="carousel__track" id="carouselTrack"></div>
          </div>

          <button
            class="carousel__arrow carousel__arrow--prev"
            id="carouselPrev"
            type="button"
            aria-label="上一张"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M15 5l-7 7 7 7"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <button
            class="carousel__arrow carousel__arrow--next"
            id="carouselNext"
            type="button"
            aria-label="下一张"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M9 5l7 7-7 7"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>

          <div class="carousel__dots" id="carouselDots"></div>
        </div>
      </div>
    </section>

    <!-- ====================================================================
         ⑤ 用户信息展示框
         ==================================================================== -->
    <section class="userbox">
      <div class="container">
        <div class="usercard" id="usercard"></div>
      </div>
    </section>

    <!-- ====================================================================
         ⑥ 热门商品列表
         ==================================================================== -->
    <section class="hot">
      <div class="container">
        <div class="section-head">
          <h2 class="section-head__title">热门商品</h2>
          <a class="section-head__more" href="#">
            查看全部
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M9 5l7 7-7 7"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </a>
        </div>

        <ul class="goods" id="goodsGrid"></ul>
      </div>
    </section>

    <!-- 页脚：样张里只做极简一条，避免页面在商品列表后突然断掉 -->
    <footer class="foot">
      <div class="container foot__inner">
        <span>全景商城 · 前台风格样张</span>
        <span class="foot__sep">|</span>
        <span>页面内容为演示数据，非真实商品</span>
      </div>
    </footer>

    <script src="scripts/data.js"></script>
    <script src="scripts/main.js"></script>
  </body>
</html>
