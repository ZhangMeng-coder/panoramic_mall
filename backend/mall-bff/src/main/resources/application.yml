server:
  port: 8085

spring:
  application:
    name: mall-bff
  config:
    # 共享配置统一收敛到 Nacos：本服务按需引入 datasource-mysql(含 mybatis-plus) / datasource-redis / auth / feign-circuitbreaker
    # ⚠ 不带 optional: 前缀——配置中心不可用或任一 dataId 缺失时**启动即失败**，不做静默降级
    #   （本地开发环境 Nacos 本身就是必需依赖；且 feign-circuitbreaker 缺失会回落 resilience4j 默认超时 1s，属已知有问题的行为）
    import:
      - nacos:datasource-mysql.yml
      - nacos:datasource-redis.yml
      - nacos:auth.yml
      - nacos:feign-circuitbreaker.yml
  cloud:
    nacos:
      # 以下配置来自父项目 pom.xml 中的 properties（@...@ 为 Maven 资源过滤占位符）
      username: @nacos.username@
      password: @nacos.password@
      discovery:
        ip: 127.0.0.1
        server-addr: @nacos.server-addr@
      config:
        # 配置中心与注册中心同址
        server-addr: @nacos.server-addr@

# 服务侧白名单（路由前缀已剥离）：C 端自助的取码/注册/登录与**首页宫格的分类树**（/catalog/categories）放行，
# 其余（/auth/logout、/auth/me、/auth/phone、/profile、/addresses*、/cart*、/orders*、/evaluations*、
# /catalog/goods、/catalog/facets、/catalog/goods/{id}）需顾客登录态
# （common 本地认证链：JWT + Redis 快照，type=user）。
# ⚠ /profile、/addresses*、/cart*、/orders* 与 /evaluations* 都是「登录顾客对自己数据」的写/读，不进白名单
#   （顾客 id 取自登录态，域侧只按该 id 过滤，故拿不到别人的行 / 别人的单）；
#   /auth/phone 是换绑手机号，同样必须已登录。⚠ 本行是「哪些端点要登录」的清单，新增端点时同步登记。
# ⚠ 白名单是「精确路径」而不是 `/catalog/**` 前缀：分级是「首页免登录、一涉及商品查询与详情就鉴权」，
# 写成前缀会把商品分页 / 筛选 / 详情一起放开（前台裸露）。这条与网关侧逐字对应，两边同一改动内一起改。
# 数据源/mybatis-plus/jwt-secret/redis/熔断参数等
# 由 Nacos 共享配置提供（datasource-mysql.yml / datasource-redis.yml / auth.yml / feign-circuitbreaker.yml），不再本地重复。
# ⚠ /auth/sms-code 必须登记：它在登录之前被调用（「获取验证码」按钮），漏登记则取码直接 401。
# ⚠ 白名单是「网关侧 + 服务侧」两处各写一份的契约（网关侧带 /mall 前缀），单边改动 = 登不进去或裸露到公网。
panoramic:
  auth:
    whitelist-paths: /auth/login,/auth/register,/auth/sms-code,/catalog/categories
    # 本端身份类型：AuthTokenFilter 只接受该类型的登录态，跨端 token 一律按未认证处理（401）。
    # ⚠ 无默认值——必须显式声明，漏配则启动失败（见 docs/contracts/cross-cutting.md 第 9 条）。
    user-type: user
  mall:
    # 模拟短信：不接真实短信通道，取码接口只打日志，校验时与下方固定码比对
    sms-fixed-code: 888888
