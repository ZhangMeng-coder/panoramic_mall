server:
  port: 8084

spring:
  application:
    name: store-bff
  config:
    # 共享配置统一收敛到 Nacos：本服务按需引入 datasource-mysql(含 mybatis-plus) / datasource-redis / auth
    # optional: 前缀——配置中心未就绪或某 dataId 缺失时服务仍能启动（用到对应能力时才报错）
    import:
      - optional:nacos:datasource-mysql.yml
      - optional:nacos:datasource-redis.yml
      - optional:nacos:auth.yml
  cloud:
    openfeign:
      # 店铺端 BFF → store（店铺域）内部 Feign 熔断（resilience4j）：
      # 下游故障经熔断器快速失败、不拖垮调用方；降级文案在 StoreShopBffService 统一处理
      circuitbreaker:
        enabled: true
    nacos:
      # 以下配置来自父项目 pom.xml 中的 properties（@...@ 为 Maven 资源过滤占位符）
      username: @nacos.username@
      password: @nacos.password@
      discovery:
        server-addr: @nacos.server-addr@
      config:
        # 配置中心与注册中心同址
        server-addr: @nacos.server-addr@

# 服务侧白名单（路由前缀已剥离）：店主自助注册/登录放行，其余（/shops 等）需店主登录态
# （common 本地认证链：JWT + Redis 快照，type=store）。数据源/mybatis-plus/jwt-secret/redis 等
# 由 Nacos 共享配置提供（datasource-mysql.yml / datasource-redis.yml / auth.yml），不再本地重复。
# 内部调用（BFF→域）不再携带信任头令牌：域服务不做鉴权，只信任并执行；
# 身份经 X-User-Id / X-User-Type 透传供审计填充，防线收敛到网络层（域端口不对公网开放）。
panoramic:
  auth:
    whitelist-paths: /auth/login,/auth/register

# 店铺端 BFF → 业务域内部 Feign 的熔断参数（resilience4j，经 Feign circuitbreaker 生效）。
# ⚠ Feign 熔断会把调用放到独立线程执行并套 TimeLimiter：默认 1s 对含远程 DB/Redis 往返的内部调用偏紧，
#   上游偶发慢查询即被掐断并计入失败、累积打开熔断（表现为页面 500「店铺服务暂不可用」）。
#   这里显式放宽并给出可接受的降级/恢复节奏；随 store-bff 打包，与 common 的 Feign 规约配套。
#
# ⚠ ignore-exceptions：业务 4xx 不计入熔断失败率（2026-09-10 修正）。
#   域内业务校验失败（如「已上架 SKU 不可修改」「商品不存在」）经 common 的
#   InternalApiErrorDecoder 还原为 ServiceException，但它们是**调用方语义/参数错误，不是下游健康度信号**。
#   若不忽略：连续几次操作失误（默认窗口 10 次 / 最少 5 次 / 失败率 >50%）就会打开熔断，
#   把后续**正常**请求也降级成 500「店铺服务暂不可用」，错误文案与真实原因完全脱节。
#   忽略后 4xx 既不计失败也不计成功；**5xx 仍走 FeignException 照常计入**（下游故障保护不变）——
#   这个 4xx/5xx 的分野由 InternalApiErrorDecoder 按 HTTP 状态码划分，见该类的类注释。
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10          # 统计窗口调用数
        minimum-number-of-calls: 5       # 打开判断所需最少调用数
        failure-rate-threshold: 50       # 失败率超过 50% 打开
        permitted-number-of-calls-in-half-open-state: 3  # 半开试探数
        wait-duration-in-open-state: 10s # 打开后多久进入半开
        ignore-exceptions:               # 不计入失败率：下游业务 4xx（调用方语义错误），5xx 仍计入
          - com.panoramic.common.exception.ServiceException
  timelimiter:
    configs:
      default:
        timeout-duration: 10s            # 单次内部调用上限（覆盖框架默认 1s）
        cancel-running-future: true      # 超时取消进行中的调用
