server:
  port: 8084

spring:
  application:
    name: store-bff
  config:
    # 共享配置统一收敛到 Nacos：本服务按需引入 datasource-mysql(含 mybatis-plus) / datasource-redis / auth / feign-circuitbreaker
    # ⚠ 不带 optional: 前缀——配置中心不可用或任一 dataId 缺失时**启动即失败**，不做静默降级
    #   （本地开发环境 Nacos 本身就是必需依赖；且 feign-circuitbreaker 缺失会回落 resilience4j 默认超时 1s，属已知有问题的行为）
    import:
      - nacos:datasource-mysql.yml
      - nacos:datasource-redis.yml
      - nacos:auth.yml
      - nacos:feign-circuitbreaker.yml
  cloud:
    nacos:
      # 以下配置来自父项目 pom.xml 中的 properties（@...@ 为 Maven 资源过滤占位符）
      username: @nacos.username@
      password: @nacos.password@
      discovery:
        server-addr: @nacos.server-addr@
      config:
        # 配置中心与注册中心同址
        server-addr: @nacos.server-addr@

# 服务侧白名单（路由前缀已剥离）：店主自助注册/登录放行，其余（/shops 等）需店主登录态
# （common 本地认证链：JWT + Redis 快照，type=store）。数据源/mybatis-plus/jwt-secret/redis/熔断参数等
# 由 Nacos 共享配置提供（datasource-mysql.yml / datasource-redis.yml / auth.yml / feign-circuitbreaker.yml），不再本地重复。
# 内部调用（BFF→域）不再携带信任头令牌：域服务不做鉴权，只信任并执行；
# 身份经 X-User-Id / X-User-Type 透传供审计填充，防线收敛到网络层（域端口不对公网开放）。
panoramic:
  auth:
    whitelist-paths: /auth/login,/auth/register

# 店铺端 BFF → 业务域内部 Feign 的熔断参数（spring.cloud.openfeign.circuitbreaker + resilience4j）
# 已收敛到 Nacos 共享配置 feign-circuitbreaker.yml——与 admin 同源一份（两处原先逐字重复），不再本地重复。
# ⚠ 该 dataId 在 import 中不带 optional:，缺失时启动即失败，不会静默回落。
