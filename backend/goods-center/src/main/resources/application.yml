server:
  port: 8081

spring:
  application:
    name: goods-center
  config:
    # 共享配置统一收敛到 Nacos：本服务按需引入 datasource-mysql(含 mybatis-plus) / datasource-redis / auth
    # optional: 前缀——配置中心未就绪或某 dataId 缺失时服务仍能启动（用到对应能力时才报错）
    import:
      - optional:nacos:datasource-mysql.yml
      - optional:nacos:datasource-redis.yml
      - optional:nacos:auth.yml
  cloud:
    nacos:
      # 以下配置来自父项目 pom.xml 中的 properties（@...@ 为 Maven 资源过滤占位符）
      username: @nacos.username@
      password: @nacos.password@
      discovery:
        server-addr: @nacos.server-addr@
      config:
        # 配置中心与注册中心同址
        server-addr: @nacos.server-addr@

# goods-center 为下沉纯域（标准商品平台 / 标准商品模板库）：不再向页面暴露公网路由，
# 仅被各端 BFF 经内部 Feign（/internal/goods/**）调用；服务端不启用 Feign 客户端扫描。
# 权限判定已收敛在端 BFF（@PreAuthorize），本服务只执行 + 审计填充：
#   /internal/** 先由 InternalTrustFilter 校验内部信任头令牌，再由 GoodsUserIdentityFilter 把
#   X-User-Id 信任头直取填 UserContext(id)（不打 Redis）供审计字段自动填充，随后 GoodsSecurityConfig
#   本地安全链放行执行（绕开 common 的 AuthTokenFilter 每次打 Redis 重建登录用户）。
# 数据源/mybatis-plus/jwt-secret 等由 Nacos 共享配置提供（datasource-mysql.yml / auth.yml）；
# datasource-redis.yml 仍保留仅因 common 的 AuthTokenFilter/LoginUserCacheService Bean 需要装配，
# /internal 路径已不再请求 Redis。
panoramic:
  internal:
    # 内部调用信任头令牌（X-Internal-Token 校验值），需与调用方 admin 端一致，勿单边改动
    secret: panoramic-mall-internal-dev-token
