server:
  port: 8082

spring:
  application:
    name: admin
  config:
    # 共享配置统一收敛到 Nacos：本服务按需引入 datasource-mysql(含 mybatis-plus) / datasource-redis / auth
    # optional: 前缀——配置中心未就绪或某 dataId 缺失时服务仍能启动（用到对应能力时才报错）
    import:
      - optional:nacos:datasource-mysql.yml
      - optional:nacos:datasource-redis.yml
      - optional:nacos:auth.yml
  cloud:
    openfeign:
      # admin 端 BFF → goods-center（标准商品平台）内部 Feign 熔断（resilience4j）：
      # 下游故障经熔断器快速失败、不拖垮调用方；降级文案在 GoodsTemplateBffService 统一处理
      circuitbreaker:
        enabled: true
    nacos:
      # 以下配置来自父项目 pom.xml 中的 properties（@...@ 为 Maven 资源过滤占位符）
      username: @nacos.username@
      password: @nacos.password@
      discovery:
        server-addr: @nacos.server-addr@
      config:
        # 配置中心与注册中心同址
        server-addr: @nacos.server-addr@

# 服务侧白名单（路由前缀已剥离）：登录接口放行，其余需认证。
# 数据源/mybatis-plus/jwt-secret/redis 等由 Nacos 共享配置提供（datasource-mysql.yml / datasource-redis.yml / auth.yml），不再本地重复。
panoramic:
  auth:
    whitelist-paths: /auth/login
  internal:
    # 内部调用信任头令牌（BFF→域，X-Internal-Token 值），需与 goods-center 侧保持一致，勿单边改动
    secret: panoramic-mall-internal-dev-token

# admin 端 BFF → 业务域内部 Feign 的熔断参数（resilience4j，经 Feign circuitbreaker 生效）。
# ⚠ Feign 熔断会把调用放到独立线程执行并套 TimeLimiter：默认 1s 对含远程 DB/Redis 往返的内部调用偏紧，
#   上游偶发慢查询即被掐断并计入失败、累积打开熔断（表现为页面 500「商品服务暂不可用」）。
#   这里显式放宽并给出可接受的降级/恢复节奏；随 admin 打包，与 common 的 Feign 规约配套。
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10          # 统计窗口调用数
        minimum-number-of-calls: 5       # 打开判断所需最少调用数
        failure-rate-threshold: 50       # 失败率超过 50% 打开
        permitted-number-of-calls-in-half-open-state: 3  # 半开试探数
        wait-duration-in-open-state: 10s # 打开后多久进入半开
  timelimiter:
    configs:
      default:
        timeout-duration: 10s            # 单次内部调用上限（覆盖框架默认 1s）
        cancel-running-future: true      # 超时取消进行中的调用
