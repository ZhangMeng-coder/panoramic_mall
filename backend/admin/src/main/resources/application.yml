server:
  port: 8082

spring:
  application:
    name: admin
  cloud:
    nacos:
      # 以下配置来自父项目 pom.xml 中的 properties（@...@ 为 Maven 资源过滤占位符）
      username: @nacos.username@
      password: @nacos.password@
      discovery:
        server-addr: @nacos.server-addr@
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 连接信息通过环境变量注入（默认本机 127.0.0.1 root/root，库 panoramic_mall，与 goods-center 同库）
    url: jdbc:mysql://123.56.117.17:${MYSQL_PORT:3306}/${MYSQL_DB:panoramic_mall}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
  data:
    redis:
      # 登录用户上下文缓存（默认本机，可用 REDIS_HOST/REDIS_PORT/REDIS_PASSWORD 覆盖；与 gateway/goods-center 同一实例）
      host: 123.56.117.17
      port: 6379
      password:

mybatis-plus:
  global-config:
    banner: false
    db-config:
      id-type: auto
      # 逻辑删除：is_delete 字段（见 common BaseEntity 的 @TableLogic）
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    # 开发期打印 SQL 日志，上线前移除
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 鉴权统一配置（值由父 pom properties 的 @...@ 资源过滤注入，与 gateway/goods-center/common 保持一致）
panoramic:
  auth:
    jwt-secret: @panoramic.auth.jwt-secret@
    jwt-expire-seconds: @panoramic.auth.jwt-expire-seconds@
    redis-prefix: @panoramic.auth.redis-prefix@
    header-name: @panoramic.auth.header-name@
    # 服务侧白名单（路由前缀已剥离）：登录接口放行，其余需认证
    whitelist-paths: /auth/login
