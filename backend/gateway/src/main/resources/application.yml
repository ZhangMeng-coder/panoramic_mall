server:
  port: 8080

spring:
  application:
    name: gateway
  config:
    # 共享配置统一收敛到 Nacos：网关无需数据源，按需引入 datasource-redis / auth
    # optional: 前缀——配置中心未就绪或某 dataId 缺失时服务仍能启动（用到对应能力时才报错）
    import:
      - optional:nacos:datasource-redis.yml
      - optional:nacos:auth.yml
  cloud:
    nacos:
      # 以下配置来自父项目 pom.xml 中的 properties（@...@ 为 Maven 资源过滤占位符）
      username: @nacos.username@
      password: @nacos.password@
      discovery:
        server-addr: @nacos.server-addr@
      config:
        # 配置中心与注册中心同址
        server-addr: @nacos.server-addr@
    gateway:
      server:
        webflux:
          routes:
            - id: goods-center-route
              uri: lb://goods-center
              filters:
                - StripPrefix=1
              predicates:
                - Path=/goods/**
            - id: admin-route
              uri: lb://admin
              filters:
                - StripPrefix=1
              predicates:
                - Path=/admin/**

# 网关白名单（带路由前缀；逗号分隔）：登录接口放行，其余先验 JWT+Redis。
# jwt-secret/redis-prefix/header-name 由 Nacos auth.yml 统一提供，不再重复。
panoramic:
  auth:
    whitelist-paths: /admin/auth/login,/discovery/**
