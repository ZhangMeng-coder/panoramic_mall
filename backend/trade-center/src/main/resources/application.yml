server:
  port: 8087

spring:
  application:
    name: trade-center
  config:
    # 共享配置统一收敛到 Nacos：本服务引入 datasource-mysql(含 mybatis-plus)、datasource-redis、feign-circuitbreaker 与 seata。
    # ⚠ 本域**是全仓库唯一加载 datasource-redis.yml 的域服务**（购物车加购去重 + 行数读穿透缓存的
    #    旁路缓存），属 cross-cutting.md 第 12 条「Nacos 加载矩阵」的登记例外；
    #    其余域服务（goods-center / store / customer-center）都不引它。
    # ⚠ 本域**也是唯一加载 feign-circuitbreaker.yml 的域服务**：下单要经 Feign 调 store 域
    #    （商品快照 / 扣库存），域间调用同样要熔断与 4xx-5xx 分野，见 cross-cutting 第 24 条。
    # ⚠ 域服务不做鉴权、不碰登录态，故**仍不引入 auth.yml**——「调域」与「被鉴权」是两件事：
    #    本域拿不到认证链、也不做任何权限判断，身份头只读来填 UserContext / 透传下游。
    # ⚠ 本域**也是发起全局事务（TM）的域**：seata.yml 提供 TC 地址与事务分组，
    #    @GlobalTransactional 落在 OrderCreateCoordinator#create（见 cross-cutting 第 12 / 24 条）。
    # ⚠ 不带 optional: 前缀——配置中心不可用或该 dataId 缺失时**启动即失败**，不做静默降级
    import:
      - nacos:datasource-mysql.yml
      - nacos:datasource-redis.yml
      - nacos:feign-circuitbreaker.yml
      - nacos:seata.yml
  cloud:
    nacos:
      # 以下配置来自父项目 pom.xml 中的 properties（@...@ 为 Maven 资源过滤占位符）
      username: @nacos.username@
      password: @nacos.password@
      discovery:
        server-addr: @nacos.server-addr@
      config:
        # 配置中心与注册中心同址
        server-addr: @nacos.server-addr@

# trade-center 为下沉纯域（交易域）：不向页面暴露公网路由，只被端 BFF 经内部 Feign（/internal/trade/**）调用
# —— 购物车 ← mall-bff；订单 ← 三端 BFF（mall-bff 顾客侧 / store-bff 商户侧 / admin 管理端），
#    各端订单编排尚未创建（页面契约见 docs/contracts/{mall-bff,store-bff,admin}.md）。
#    订单 6 条接口**按能力通用、不分侧**（cross-cutting 第 22 条）：三端调的是同一个端点，
#    差别只在传不传作用域（读侧可选、写侧必填）。
# 服务端**启用 Feign 客户端扫描**（只扫 store 域：com.panoramic.contract.store，见 TradeCenterApplication）——它是被调方，
# 同时**也是调用方**：下单流水线的 goods-check / stock-check 要问 store 域要商品快照并扣减库存（域间协作，cross-cutting 第 24 条）。
# 鉴权与权限判定全部收敛在端 BFF（各 BFF 从登录态取锚点 customerId / storeId），本服务只做两件事：
#   1) 执行领域逻辑（购物车 trade_cart_item、订单 trade_order 等 5 张表，全按传入锚点过滤）；
#   2) TradeUserIdentityFilter 把网关注入的信任头 X-User-Id / X-User-Type 直取填 UserContext
#      （不校验 token、不做权限判断；缺头则不填充，审计字段留空）。
# 数据源/mybatis-plus 由 Nacos 共享配置 datasource-mysql.yml 提供。
#
# ⚠ 本域为什么破例加载 datasource-redis.yml（全仓唯一的域服务）——两个键，都是**性能优化**，不是事实源：
#   ① panoramic:cart:skus:{customerId}（Set，只放 skuId、TTL 24h）：加购的第一遍重复过滤，命中即走原子自增；
#   ② panoramic:cart:count:{customerId}（String=行数、TTL 60s）：购物车行数的读穿透缓存（不做 INCRBY 算式）。
#   **这不是把鉴权下沉**：Redis 里没有登录态、没有 token、没有权限快照，本域仍然不鉴权、不查登录态；
#   两个键与库数据**无强一致要求**，Redis 不可用时全部吞异常降级（见 config/CartRedisCache），
#   **MySQL（trade_cart_item）始终是唯一事实源**。两个方向的错判都能自愈（误报 → 自增 0 行 → 回插；
#   漏报 → 唯一键冲突 → 转原子自增），详见 backend/trade-center/README.md。
# ⚠ 部署前提：8087 端口只在内网可达，否则可伪造 X-User-Id；这是「域服务去鉴权」的既有取舍。

# 订单生成流水线与状态机配置（订单已真实落库：trade_order 等 5 张表；对外接口见 docs/contracts/trade-center.md）
panoramic:
  trade:
    order:
      # 商品 / 库存指向谁：feign = 经 StoreClient 调真实 store 域（下单流水线的 goods-check 取 SKU 快照 /
      # stock-check 扣减库存）；阶段一的 mock 内存脚手架已随 T4b 删除（todo 残留 9），故本键只剩这一个取值。
      # ⚠ matchIfMissing 已在 T4b 翻到 feign 侧（原先在 mock 侧）：本行仍是**显式**写下的，缺了它也只是
      #    回到「当前唯一存在的装配」。写错一个值（feigned / 已作废的 mock / 空串）则一个 bean 都不装配，
      #    启动即报「找不到 GoodsQueryPort / StockPort 的 bean」——起不来，而不是悄悄接单。
      store-adapter: feign
      # 订单仓库：jdbc = 真实落库 / memory = 内存实现（无数据源场景，如装配层单测）。
      # ⚠ 与上面的 store-adapter 刻意不同：本键**不设默认值**——「缺失时该按哪个」在这里没有唯一答案，
      #    故二选一必须显式写；缺失时两边都不装配，启动即报「找不到 OrderRepository 的 bean」。
      repository: jdbc
      # 订单生成步骤：数组顺序即执行顺序；名称对应 OrderCreateStep#name()，配了不存在的名字则启动失败
      steps:
        - goods-check
        - stock-check
        - price-compute
      # 订单状态流转顺序：只允许「下标 +1」的推进；必须覆盖 OrderStatus 全部常量，缺一个即启动失败
      status-flow:
        - PENDING_PAYMENT
        - PAID
        - SHIPPED
        - RECEIVED
      # 幂等窗口（秒）：同指纹在该窗口内视为重复提交
      idempotency-window-seconds: 300
      # 订单号冲突时的重试上限
      order-no-max-retry: 5
