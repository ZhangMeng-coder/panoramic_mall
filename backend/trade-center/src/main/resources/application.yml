server:
  port: 8087

spring:
  application:
    name: trade-center
  config:
    # 共享配置统一收敛到 Nacos：本服务引入 datasource-mysql(含 mybatis-plus) 与 datasource-redis。
    # ⚠ 本域**是全仓库唯一加载 datasource-redis.yml 的域服务**（购物车加购去重 + 行数读穿透缓存的
    #    旁路缓存），属 cross-cutting.md 第 12 条「Nacos 加载矩阵」的登记例外；
    #    其余域服务（goods-center / store / customer-center）都不引它。
    # ⚠ 域服务不做鉴权、不碰登录态，故不引入 auth.yml；也不走 Feign 客户端，故不引入 feign-circuitbreaker.yml。
    # ⚠ 不带 optional: 前缀——配置中心不可用或该 dataId 缺失时**启动即失败**，不做静默降级
    import:
      - nacos:datasource-mysql.yml
      - nacos:datasource-redis.yml
  cloud:
    nacos:
      # 以下配置来自父项目 pom.xml 中的 properties（@...@ 为 Maven 资源过滤占位符）
      username: @nacos.username@
      password: @nacos.password@
      discovery:
        server-addr: @nacos.server-addr@
      config:
        # 配置中心与注册中心同址
        server-addr: @nacos.server-addr@

# trade-center 为下沉纯域（交易域）：不向页面暴露公网路由，仅被 mall-bff 经内部 Feign（/internal/trade/**）调用；
# 服务端不启用 Feign 客户端扫描。鉴权与权限判定全部收敛在端 BFF（mall-bff 从登录态取 customerId），本服务只做两件事：
#   1) 执行领域逻辑（购物车 trade_cart_item，全按传入锚点 customerId 过滤）；
#   2) TradeUserIdentityFilter 把网关注入的信任头 X-User-Id / X-User-Type 直取填 UserContext
#      （不校验 token、不做权限判断；缺头则不填充，审计字段留空）。
# 数据源/mybatis-plus 由 Nacos 共享配置 datasource-mysql.yml 提供。
#
# ⚠ 本域为什么破例加载 datasource-redis.yml（全仓唯一的域服务）——两个键，都是**性能优化**，不是事实源：
#   ① panoramic:cart:skus:{customerId}（Set，只放 skuId、TTL 24h）：加购的第一遍重复过滤，命中即走原子自增；
#   ② panoramic:cart:count:{customerId}（String=行数、TTL 60s）：购物车行数的读穿透缓存（不做 INCRBY 算式）。
#   **这不是把鉴权下沉**：Redis 里没有登录态、没有 token、没有权限快照，本域仍然不鉴权、不查登录态；
#   两个键与库数据**无强一致要求**，Redis 不可用时全部吞异常降级（见 config/CartRedisCache），
#   **MySQL（trade_cart_item）始终是唯一事实源**。两个方向的错判都能自愈（误报 → 自增 0 行 → 回插；
#   漏报 → 唯一键冲突 → 转原子自增），详见 backend/trade-center/README.md。
# ⚠ 部署前提：8087 端口只在内网可达，否则可伪造 X-User-Id；这是「域服务去鉴权」的既有取舍。

# 订单生成流水线与状态机配置（本期为纯领域模型，无接口、不落库；见仓库根 todo.md 执行计划）
panoramic:
  trade:
    order:
      # 订单生成步骤：数组顺序即执行顺序；名称对应 OrderCreateStep#name()，配了不存在的名字则启动失败
      steps:
        - goods-check
        - stock-check
        - price-compute
      # 订单状态流转顺序：只允许「下标 +1」的推进；必须覆盖 OrderStatus 全部常量，缺一个即启动失败
      status-flow:
        - PENDING_PAYMENT
        - PAID
        - SHIPPED
        - RECEIVED
      # 幂等窗口（秒）：同指纹在该窗口内视为重复提交
      idempotency-window-seconds: 300
      # 订单号冲突时的重试上限
      order-no-max-retry: 5
