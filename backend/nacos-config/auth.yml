# ============================================================
# Nacos 共享配置：鉴权统一参数（data-id: auth.yml, GROUP: DEFAULT_GROUP）
# 由端 BFF（admin / store-bff）与 gateway 经 spring.config.import 加载；业务域服务
# （goods-center / store）不加载本文件——域服务不做鉴权、不碰登录态。
# 签发端(端 BFF)、校验端(gateway) 必须一致；
# 原父 pom properties 中 @panoramic.auth.*@ 已移除，统一收敛到本文件。
# 生产需要覆盖时请在此处整体修改（多端同源，不再散落各处）。
# ============================================================
panoramic:
  auth:
    # JWT 签发/验签密钥（长度 >= 32 字节）
    jwt-secret: panoramic-mall-auth-jwt-secret-dev-0123456789abcdef0123456789
    # 登录态有效期（秒）：端 BFF 签发设 TTL，gateway 只校验不签发；改本键后需重启端 BFF 生效
    jwt-expire-seconds: 7200
    # Redis 登录用户缓存键前缀。实际键 = 前缀 + ":" + userType + ":" + userId，
    # 如 panoramic:login:admin:1（平台管理员）/ panoramic:login:store:7（店主）/ panoramic:login:user:42（C 端顾客）。
    # userType 段隔离各端身份空间，避免不同端 id 冲突串登录态；网关与端 BFF 必须同源，勿单边改动。
    redis-prefix: panoramic:login
    # 网关透传用户头名（网关注入 X-User-Id / X-User-Type；端 BFF/域服务按此头读取身份）
    header-name: X-User-Id
