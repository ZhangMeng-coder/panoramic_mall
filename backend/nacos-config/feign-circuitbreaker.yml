# ============================================================
# Nacos 共享配置：Feign 熔断（data-id: feign-circuitbreaker.yml, GROUP: DEFAULT_GROUP）
# 由端 BFF（admin / store-bff / mall-bff）经 spring.config.import 加载。gateway 不加载。
#
# ⚠ 加载方还有 **trade-center**（唯一的域侧例外）：本域既是被调方，**也是调用方**——
#   下单要经 Feign 调 store 域（商品快照 / 扣减库存），域间调用同样要熔断。
#   其余业务域（goods-center / store / customer-center）都不走 Feign 客户端，故不加载本文件。
#   见 docs/contracts/cross-cutting.md 第 12 条加载矩阵与第 24 条「域间协作」。
#
# 为什么收敛到这里：admin 与 store-bff 的这段配置**逐字相同**，原先各持一份——
# 改一个阈值要改两处并重新打包两个服务；2026-09-10 修「业务 4xx 误计熔断」时就是两边同改的。
# 收进 Nacos 后单点维护，三个端 BFF 引用同一份。
#
# ⚠ 本文件在 application.yml 的 import 中**不带 optional:** 前缀：
#   缺本配置时服务启动即失败，而不是静默回落到 resilience4j 默认值——默认 TimeLimiter 是 1s，
#   正是 2026-09-10 修掉的那个坑（偶发慢查询被掐断并计入失败、累积打开熔断）。
# ============================================================
spring:
  cloud:
    openfeign:
      # 开启 Feign 的 resilience4j 熔断（经 Feign circuitbreaker 生效）：
      # 下游故障经熔断器快速失败、不拖垮调用方；降级文案在各端 BFF 的编排 service 统一处理
      circuitbreaker:
        enabled: true

# 端 BFF → 业务域内部 Feign 的熔断参数（resilience4j，经 Feign circuitbreaker 生效）。
# ⚠ Feign 熔断会把调用放到独立线程执行并套 TimeLimiter：默认 1s 对含远程 DB/Redis 往返的内部调用偏紧，
#   上游偶发慢查询即被掐断并计入失败、累积打开熔断（表现为页面 500「…服务暂不可用」）。
#   这里显式放宽并给出可接受的降级/恢复节奏；三个端 BFF 同源一份，与 common 的 Feign 规约配套。
#
# ⚠ 失败信号 = HTTP 非 2xx / 连接失败 /（TimeLimiter）超时，就这些。
#   域侧**业务失败**（如「已上架 SKU 不可修改」「商品不存在」）一律 **HTTP 200 + code≠200**，
#   不抛异常也不落 4xx，故压根不进熔断统计——**这里不再需要任何「忽略某类业务异常」的配置项**。
#   2026-09-10 曾在此挂过一条忽略名单把 ServiceException 排除在失败率外：那是「域侧抛 ServiceException、
#   浏览器收到 4xx」时代的补丁——那时业务错与下游故障同为异常，只能靠异常类型掰开。
#   现在两者从**信封**上就分开了（200+code vs 5xx），再挂忽略名单等于给一个已不存在的场景留后门。
#   ⚠ 该配置项与 common 里那个按 HTTP 状态码分野的解码器均已删除，并列入**反向哨兵**——
#     源码里出现其字面量即判错，故此处只用文字描述、不写出它们的名字。
#     见 docs/contracts/cross-cutting.md 第六节与第 13 条。
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10          # 统计窗口调用数
        minimum-number-of-calls: 5       # 打开判断所需最少调用数
        failure-rate-threshold: 50       # 失败率超过 50% 打开
        permitted-number-of-calls-in-half-open-state: 3  # 半开试探数
        wait-duration-in-open-state: 10s # 打开后多久进入半开
  timelimiter:
    configs:
      default:
        timeout-duration: 10s            # 单次内部调用上限（覆盖框架默认 1s）
        cancel-running-future: true      # 超时取消进行中的调用
