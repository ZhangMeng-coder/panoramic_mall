# 商城前台（frontend/mall 产物）—— nginx 容器挂载配置
# 落盘：dist 内容解到容器内 /usr/share/nginx/html/mall，本文件挂到 conf.d/
server {
    listen 83;

    location / {
        root /usr/share/nginx/html/mall;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 商城前台接口：/mall/** 原样交给网关（网关 StripPrefix=1 负责剥掉 /mall）
    # ⚠ proxy_pass 末尾不得带 URI（不能写成 http://172.17.0.1:8080/），
    #   带了会把 /mall/auth/login 改写成 /auth/login，网关再剥一层 → 路径错位（全 404）。
    # 172.17.0.1 = 宿主机在 docker 网桥上的地址；后端 jar 跑在宿主机，网关监听 8080。
    location /mall/ {
        proxy_pass http://172.17.0.1:8080;
        proxy_set_header Host $proxy_host;   # 对齐 dev proxy 的 changeOrigin: true
    }
}
